<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.5" stop-color="#151b3a"/>
      <stop offset="1" stop-color="#0d2230"/>
    </linearGradient>
    <radialGradient id="glowC" r="0.5"><stop offset="0" stop-color="#4fd1c5" stop-opacity="0.35"/><stop offset="1" stop-color="#4fd1c5" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowA" r="0.5"><stop offset="0" stop-color="#b794f4" stop-opacity="0.35"/><stop offset="1" stop-color="#b794f4" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowD" r="0.5"><stop offset="0" stop-color="#f6ad55" stop-opacity="0.35"/><stop offset="1" stop-color="#f6ad55" stop-opacity="0"/></radialGradient>
    <linearGradient id="flow" x1="0" x2="1">
      <stop offset="0" stop-color="#4fd1c5"/><stop offset="0.5" stop-color="#b794f4"/><stop offset="1" stop-color="#f6ad55"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="2"/></filter>
    <style>
      .t{font-family:'JetBrains Mono',Consolas,monospace;}
      .bond{stroke:#4fd1c5;stroke-width:3;fill:none}
      .edge{stroke:#b794f4;stroke-opacity:.35;stroke-width:1.2}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      .p2{animation-delay:.6s}.p3{animation-delay:1.2s}.p4{animation-delay:1.8s}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
      .spin{transform-origin:220px 200px;animation:spin 30s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      .dash{stroke-dasharray:6 10;animation:dash 1.2s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-16}}
      .twinkle{animation:tw 3s ease-in-out infinite}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:.8}}
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="400" rx="18" fill="url(#bg)"/>
  <g fill="#fff">
    <circle class="twinkle" cx="80" cy="40" r="1.2"/><circle class="twinkle p2" cx="400" cy="30" r="1"/>
    <circle class="twinkle p3" cx="620" cy="370" r="1.3"/><circle class="twinkle p4" cx="1120" cy="50" r="1"/>
    <circle class="twinkle" cx="760" cy="25" r="1"/><circle class="twinkle p2" cx="1160" cy="360" r="1.2"/>
    <circle class="twinkle p3" cx="30" cy="350" r="1"/><circle class="twinkle p4" cx="500" cy="380" r="1"/>
  </g>
  <circle cx="220" cy="200" r="170" fill="url(#glowC)"/>
  <circle cx="600" cy="200" r="170" fill="url(#glowA)"/>
  <circle cx="980" cy="200" r="170" fill="url(#glowD)"/>

  <!-- ========== CHEMISTRY: rotating molecule + orbiting electrons ========== -->
  <g class="spin">
    <!-- benzene ring -->
    <polygon class="bond" points="220,140 272,170 272,230 220,260 168,230 168,170"/>
    <polygon points="220,156 258,178 258,222 220,244 182,222 182,178" fill="none" stroke="#4fd1c5" stroke-opacity=".5" stroke-width="2" stroke-dasharray="10 8"/>
    <!-- substituents -->
    <line class="bond" x1="220" y1="140" x2="220" y2="95"/>
    <line class="bond" x1="272" y1="230" x2="312" y2="253"/>
    <line class="bond" x1="168" y1="230" x2="128" y2="253"/>
    <g>
      <circle cx="220" cy="140" r="9" fill="#2d3748" stroke="#4fd1c5" stroke-width="2"/>
      <circle cx="272" cy="170" r="9" fill="#2d3748" stroke="#4fd1c5" stroke-width="2"/>
      <circle cx="272" cy="230" r="9" fill="#2d3748" stroke="#4fd1c5" stroke-width="2"/>
      <circle cx="220" cy="260" r="9" fill="#2d3748" stroke="#4fd1c5" stroke-width="2"/>
      <circle cx="168" cy="230" r="9" fill="#2d3748" stroke="#4fd1c5" stroke-width="2"/>
      <circle cx="168" cy="170" r="9" fill="#2d3748" stroke="#4fd1c5" stroke-width="2"/>
      <circle cx="220" cy="90" r="12" fill="#e53e3e"/>
      <circle cx="316" cy="256" r="12" fill="#3182ce"/>
      <circle cx="124" cy="256" r="10" fill="#e2e8f0"/>
    </g>
  </g>
  <!-- electron orbits -->
  <g fill="none" stroke="#4fd1c5" stroke-opacity=".25">
    <ellipse cx="220" cy="200" rx="150" ry="45" transform="rotate(30 220 200)"/>
    <ellipse cx="220" cy="200" rx="150" ry="45" transform="rotate(-30 220 200)"/>
  </g>
  <g transform="rotate(30 220 200)">
    <circle r="5" fill="#81e6d9"><animateMotion dur="4s" repeatCount="indefinite" path="M370,200 a150,45 0 1,1 -300,0 a150,45 0 1,1 300,0"/></circle>
  </g>
  <g transform="rotate(-30 220 200)">
    <circle r="5" fill="#81e6d9"><animateMotion dur="5s" repeatCount="indefinite" path="M70,200 a150,45 0 1,0 300,0 a150,45 0 1,0 -300,0"/></circle>
  </g>
  <text class="t" x="220" y="370" fill="#4fd1c5" font-size="16" text-anchor="middle">⚛ CHEMISTRY</text>
  <text class="t" x="220" y="34" fill="#4fd1c5" fill-opacity=".7" font-size="13" text-anchor="middle">ĤΨ = EΨ</text>

  <!-- connecting flow chemistry -> AI -->
  <path class="dash" d="M380,200 C430,150 450,250 490,200" stroke="url(#flow)" stroke-width="2.5" fill="none"/>

  <!-- ========== AI: neural network ========== -->
  <g class="edge">
    <!-- layer1 (530) -> layer2 (600) -->
    <line x1="530" y1="130" x2="600" y2="110"/><line x1="530" y1="130" x2="600" y2="170"/><line x1="530" y1="130" x2="600" y2="230"/><line x1="530" y1="130" x2="600" y2="290"/>
    <line x1="530" y1="200" x2="600" y2="110"/><line x1="530" y1="200" x2="600" y2="170"/><line x1="530" y1="200" x2="600" y2="230"/><line x1="530" y1="200" x2="600" y2="290"/>
    <line x1="530" y1="270" x2="600" y2="110"/><line x1="530" y1="270" x2="600" y2="170"/><line x1="530" y1="270" x2="600" y2="230"/><line x1="530" y1="270" x2="600" y2="290"/>
    <!-- layer2 -> layer3 (670) -->
    <line x1="600" y1="110" x2="670" y2="160"/><line x1="600" y1="110" x2="670" y2="240"/>
    <line x1="600" y1="170" x2="670" y2="160"/><line x1="600" y1="170" x2="670" y2="240"/>
    <line x1="600" y1="230" x2="670" y2="160"/><line x1="600" y1="230" x2="670" y2="240"/>
    <line x1="600" y1="290" x2="670" y2="160"/><line x1="600" y1="290" x2="670" y2="240"/>
  </g>
  <!-- signals travelling -->
  <g fill="#e9d8fd">
    <circle r="3"><animateMotion dur="1.6s" repeatCount="indefinite" path="M530,130 L600,230 L670,160"/></circle>
    <circle r="3"><animateMotion dur="1.6s" begin=".5s" repeatCount="indefinite" path="M530,270 L600,110 L670,240"/></circle>
    <circle r="3"><animateMotion dur="1.6s" begin="1s" repeatCount="indefinite" path="M530,200 L600,290 L670,160"/></circle>
  </g>
  <g stroke="#b794f4" stroke-width="2" fill="#2a2150">
    <circle class="pulse" cx="530" cy="130" r="12"/><circle class="pulse p2" cx="530" cy="200" r="12"/><circle class="pulse p3" cx="530" cy="270" r="12"/>
    <circle class="pulse p2" cx="600" cy="110" r="12"/><circle class="pulse p3" cx="600" cy="170" r="12"/><circle class="pulse p4" cx="600" cy="230" r="12"/><circle class="pulse" cx="600" cy="290" r="12"/>
    <circle class="pulse p4" cx="670" cy="160" r="12"/><circle class="pulse p2" cx="670" cy="240" r="12"/>
  </g>
  <text class="t" x="600" y="370" fill="#b794f4" font-size="16" text-anchor="middle">🤖 AI / ML</text>
  <text class="t" x="600" y="34" fill="#b794f4" fill-opacity=".7" font-size="13" text-anchor="middle">σ(Wx + b)</text>

  <!-- connecting flow AI -> Data -->
  <path class="dash" d="M690,200 C740,150 760,250 820,200" stroke="url(#flow)" stroke-width="2.5" fill="none"/>

  <!-- ========== DATA: database cylinders + pipeline + chart ========== -->
  <g stroke="#f6ad55" stroke-width="2" fill="#2d2416">
    <path d="M850,120 v50 a35,10 0 0,0 70,0 v-50"/>
    <ellipse cx="885" cy="120" rx="35" ry="10"/>
    <path d="M850,145 a35,10 0 0,0 70,0" fill="none" stroke-opacity=".6"/>
    <path d="M850,230 v50 a35,10 0 0,0 70,0 v-50"/>
    <ellipse cx="885" cy="230" rx="35" ry="10"/>
    <path d="M850,255 a35,10 0 0,0 70,0" fill="none" stroke-opacity=".6"/>
  </g>
  <!-- pipeline to chart -->
  <path class="dash" d="M920,150 C960,150 960,200 1000,200 M920,260 C960,260 960,200 1000,200" stroke="#f6ad55" stroke-width="2" fill="none"/>
  <!-- data packets -->
  <g fill="#fbd38d">
    <rect width="7" height="7" rx="1.5"><animateMotion dur="2s" repeatCount="indefinite" path="M920,150 C960,150 960,200 1000,200"/></rect>
    <rect width="7" height="7" rx="1.5"><animateMotion dur="2s" begin="1s" repeatCount="indefinite" path="M920,260 C960,260 960,200 1000,200"/></rect>
  </g>
  <!-- bar chart -->
  <g fill="#f6ad55">
    <rect x="1010" y="230" width="18" height="40" rx="3"><animate attributeName="height" values="40;70;40" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="230;200;230" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="1036" y="200" width="18" height="70" rx="3" fill-opacity=".85"><animate attributeName="height" values="70;40;70" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="200;230;200" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="1062" y="170" width="18" height="100" rx="3" fill-opacity=".7"><animate attributeName="height" values="100;120;100" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="170;150;170" dur="3s" repeatCount="indefinite"/></rect>
    <rect x="1088" y="140" width="18" height="130" rx="3" fill-opacity=".55"><animate attributeName="height" values="130;90;130" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="140;180;140" dur="3s" repeatCount="indefinite"/></rect>
  </g>
  <line x1="1002" y1="272" x2="1115" y2="272" stroke="#f6ad55" stroke-opacity=".6"/>
  <polyline points="1019,215 1045,190 1071,160 1097,125" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text class="t" x="980" y="370" fill="#f6ad55" font-size="16" text-anchor="middle">🗄️ DATA ENGINEERING</text>
  <text class="t" x="980" y="34" fill="#f6ad55" fill-opacity=".7" font-size="13" text-anchor="middle">SELECT insight FROM data;</text>

  <!-- floating binary -->
  <g class="t" font-size="11" fill="#cbd5e0" fill-opacity=".25">
    <text x="420" y="80">0101</text><text x="760" y="320">1100</text><text x="1130" y="110">10</text><text x="60" y="120">C₆H₆</text>
  </g>
</svg>
